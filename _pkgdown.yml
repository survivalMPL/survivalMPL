destination: pkgdown
url: https://CRAN.R-project.org/package=survivalMPL
template:
  bootstrap: 5
  light-switch: true

home:
  sidebar:
    structure: [links, license, citation, authors, dev-status]
    components:
      dev-status:
        title: Dev status
        text: |
          [![CRAN status](https://www.r-pkg.org/badges/version/survivalMPL)](https://CRAN.R-project.org/package=survivalMPL)
          [![Downloads](https://cranlogs.r-pkg.org/badges/survivalMPL)](https://cranlogs.r-pkg.org/badges/survivalMPL)

navbar:
  structure:
    left: [home, reference, tutorials, news]
  components:
    tutorials:
      text: Tutorials
      menu:
        - text: Getting Started
          href: articles/getting-started.html
        - text: Interval Censoring
          href: articles/interval-censoring.html
        - text: Basis Function Comparison
          href: articles/basis-comparison.html
        - text: coxph vs coxph_mpl
          href: articles/coxph-comparison.html
    news:
      text: News
      href: news/index.html

articles:
  - title: Tutorials
    contents:
      - getting-started
      - interval-censoring
      - basis-comparison
      - coxph-comparison
